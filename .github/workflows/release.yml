name: Release

# Runs when a version tag (v1.2.3) is pushed. Checks that the tag matches
# package.json and CHANGELOG.md, builds the image, publishes it to Docker Hub,
# and creates a GitHub release with the changelog section as the notes.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Verify version & changelog
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🔖 Check tag matches package.json and CHANGELOG
        id: v
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag v$tag does not match package.json version $pkg"; exit 1
          fi
          if ! grep -q "^## \[$tag\] - " CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for $tag"; exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  test:
    needs: verify
    uses: ./.github/workflows/test.yml

  publish:
    name: Build & publish image
    needs: [verify, test]
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🐳 Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 🛠️ Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ezchrono:${{ needs.verify.outputs.version }}
            ${{ secrets.DOCKER_USERNAME }}/ezchrono:latest

  github-release:
    name: Create GitHub release
    needs: [verify, publish]
    runs-on: ubuntu-latest
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 📝 Extract changelog section
        run: |
          v="${{ needs.verify.outputs.version }}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\] - " { on=1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "v${{ needs.verify.outputs.version }}" --title "ezchrono v${{ needs.verify.outputs.version }}" --notes-file RELEASE_NOTES.md

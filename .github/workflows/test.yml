name: Test

on:
  push:
    branches: [master, development]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend typecheck & tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🔍 Typecheck
        run: bun run typecheck

      - name: 🧪 Run tests
        run: bun test --randomize

  frontend:
    name: Frontend lint, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 🧾 Checkout source
        uses: actions/checkout@v4

      - name: 🥟 Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: 📦 Install dependencies
        run: bun install --frozen-lockfile

      - name: 🧹 Lint & format
        run: bunx biome ci

      - name: 🧪 Unit tests
        run: bun run test:unit

      - name: 🏗️ Build
        run: bun run build
